name: Build HeartTalk SIM Gateway APK

on:
  workflow_dispatch:
  push:
    paths:
      - "sms-gateway-android/**"
      - ".github/workflows/build-sim-gateway.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: sms-gateway-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hearttalk-sim-gateway-debug
          path: sms-gateway-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
