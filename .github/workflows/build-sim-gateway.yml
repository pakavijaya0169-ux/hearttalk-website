name: Build HeartTalk SIM Gateway APK

on:
  workflow_dispatch:
  push:
    paths:
      - "sms-gateway-android/**"
      - ".github/workflows/build-sim-gateway.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: sms-gateway-android
        run: gradle --no-daemon :app:clean :app:assembleDebug

      - name: Verify APK signature and package metadata
        run: |
          APK="sms-gateway-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          ls -lh "$APK"

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r sms-gateway-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.hearttalk.simgateway.owner/com.hearttalk.simgateway.MainActivity

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: hearttalk-sim-gateway-debug-verified
          path: sms-gateway-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
