name: Deploy Cashfree Edge Functions

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deploy-cashfree-webhook.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.58.5

      - name: Deploy cashfree-webhook
        run: supabase functions deploy cashfree-webhook --project-ref "$SUPABASE_PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dognojmymhlaewrjqswz

      - name: Deploy create-cashfree-order
        run: supabase functions deploy create-cashfree-order --project-ref "$SUPABASE_PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dognojmymhlaewrjqswz

      - name: Deploy verify-cashfree-payment
        run: supabase functions deploy verify-cashfree-payment --project-ref "$SUPABASE_PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dognojmymhlaewrjqswz
